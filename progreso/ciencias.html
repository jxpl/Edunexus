<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus - Ciencias</title>
    
    <!-- CSS de estilos -->
    <link rel="stylesheet" href="progreso.css">
    
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>EduNexus</h1>
            <nav>
                <a href="../Inicio.html">Inicio</a>
                <a href="clases.html">Clases</a>
                <a href="diplomas.html">Diplomas</a>
                <a href="progreso.html" class="active">Progreso</a>
            </nav>
        </div>
    </header>

    <div id="react-ciencias-section"></div>

    <footer>
        <p>&copy; 2026 EduNexus. Todos los derechos reservados.</p>
    </footer>

    <script type="text/babel">
        const cienciasData = {
            title: "Curso de Ciencias",
            category: "Ciencias",
            overallProgress: 75,
            lessonsCompleted: 18,
            totalLessons: 24,
            modules: [
                {
                    id: 1,
                    title: "Unidad 1: Biología Celular y Genética",
                    status: "Completado",
                    completedCount: 8,
                    totalCount: 8,
                    lessons: [
                        { name: "1.1 La Célula y sus Organelos", done: true },
                        { name: "1.2 Membrana Celular y Transporte", done: true },
                        { name: "1.3 Respiración Celular y Fotosíntesis", done: true },
                        { name: "1.4 Ciclo Celular y Mitosis", done: true },
                        { name: "1.5 Meiosis y Reproducción Sexual", done: true },
                        { name: "1.6 Leyes de Mendel", done: true },
                        { name: "1.7 Estructura del ADN y ARN", done: true },
                        { name: "1.8 Síntesis de Proteínas", done: true }
                    ]
                },
                {
                    id: 2,
                    title: "Unidad 2: Ecología y Medio Ambiente",
                    status: "Completado",
                    completedCount: 8,
                    totalCount: 8,
                    lessons: [
                        { name: "2.1 Ecosistemas y Cadenas Tróficas", done: true },
                        { name: "2.2 Ciclos Biogeoquímicos", done: true },
                        { name: "2.3 Relaciones Interespecíficas", done: true },
                        { name: "2.4 Biodiversidad y Conservación", done: true },
                        { name: "2.5 Cambio Climático y Huella de Carbono", done: true },
                        { name: "2.6 Fuentes de Energía Renovable", done: true },
                        { name: "2.7 Contaminación del Agua y Suelo", done: true },
                        { name: "2.8 Desarrollo Sostenible", done: true }
                    ]
                },
                {
                    id: 3,
                    title: "Unidad 3: Química Orgánica e Inorgánica",
                    status: "En Progreso",
                    completedCount: 2,
                    totalCount: 8,
                    lessons: [
                        { name: "3.1 La Tabla Periódica y Elementos", done: true },
                        { name: "3.2 Enlaces Químicos", done: true },
                        { name: "3.3 Reacciones Químicas y Balanceo", done: false },
                        { name: "3.4 Estequiometría", done: false },
                        { name: "3.5 Soluciones y Concentración", done: false },
                        { name: "3.6 Ácidos y Bases (pH)", done: false },
                        { name: "3.7 Hidrocarburos Básicos", done: false },
                        { name: "3.8 Grupos Funcionales Orgánicos", done: false }
                    ]
                }
            ]
        };

        function CienciasSection() {
            return (
                <section className="courses-section">
                    {/* Botón de regreso con estructura unificada */}
                    <a href="progreso.html" className="btn-enter btn-back">
                        <span className="arrow">&larr;</span>
                        <span>Volver al Progreso</span>
                    </a>

                    <div className="section-header">
                        <h2>{cienciasData.title}</h2>
                        <p>Avance general: <strong>{cienciasData.overallProgress}%</strong> ({cienciasData.lessonsCompleted} de {cienciasData.totalLessons} lecciones)</p>
                    </div>

                    <div className="courses-grid">
                        {cienciasData.modules.map(module => (
                            <article key={module.id} className="course-card">
                                <div className="card-content">
                                    <span className="course-category">{cienciasData.category}</span>
                                    <h3>{module.title}</h3>
                                    <p>Avance del módulo: {module.completedCount}/{module.totalCount} lecciones</p>
                                    
                                 <ul className="lessons-list">
    {module.lessons.map((lesson, idx) => (
        <li key={idx} className={`lesson-item ${lesson.done ? 'completed' : 'pending'}`}>
            <span className="lesson-icon">
                {lesson.done ? (
                    <svg className="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                ) : (
                    <span className="circle-icon"></span>
                )}
            </span>
            <span className="lesson-name">{lesson.name}</span>
        </li>
    ))}
</ul>
                                </div>
                                <div className="card-footer">
                                    <span className="course-lessons">Estado: {module.status}</span>
                                    <span className="course-rating">
                                        {Math.round((module.completedCount / module.totalCount) * 100)}%
                                    </span>
                                </div>
                            </article>
                        ))}
                    </div>
                </section>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-ciencias-section'));
        root.render(<CienciasSection />);
    </script>
</body>
</html>
