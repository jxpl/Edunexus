<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus - Materias Complementarias</title>

    <!-- Subimos un nivel en la carpeta para encontrar las hojas de estilo de la raíz -->
    <link rel="stylesheet" href="../inicio.css">
    <link rel="stylesheet" href="../styles.css">

    <!-- React, ReactDOM y Babel por CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        function MateriasMenu() {
            const [searchTerm, setSearchTerm] = React.useState('');
            const [showSearch, setShowSearch] = React.useState(false);

            const materiasItems = [
                { id: 1, title: "PROGRAMACIÓN WEB", imageUrl: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=150&auto=format&fit=crop&q=80", alt: "Programación Web", link: "./programacion.html" },
                { id: 2, title: "DISEÑO UX / UI", imageUrl: "https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?w=150&auto=format&fit=crop&q=80", alt: "Diseño UX/UI", link: "./diseno.html" },
                { id: 3, title: "INGLÉS TÉCNICO", imageUrl: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=150&auto=format&fit=crop&q=80", alt: "Inglés Técnico", link: "./ingles.html" },
                { id: 4, title: "BASES DE DATOS", imageUrl: "https://images.unsplash.com/photo-1544383835-bda2bc66a55d?w=150&auto=format&fit=crop&q=80", alt: "Bases de Datos", link: "./bd.html" },
                { id: 5, title: "CIENCIA DE DATOS", imageUrl: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=150&auto=format&fit=crop&q=80", alt: "Ciencia de Datos", link: "./data.html" },
                { id: 6, title: "LIDERAZGO Y GESTIÓN", imageUrl: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=150&auto=format&fit=crop&q=80", alt: "Liderazgo", link: "./liderazgo.html" }
            ];

            const filteredMaterias = materiasItems.filter(item =>
                item.title.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Función explícita de navegación JS
            const handleNavigate = (url) => {
                window.location.href = url;
            };

            return (
                <div className="dashboard-layout">
                    {/* Barra Superior */}
                    <header className="top-bar">
                        <div className="top-bar-left">
                            <button 
                                onClick={() => handleNavigate("../inicio.html")} 
                                className="icon-btn" 
                                aria-label="Volver a Inicio" 
                                style={{ background: 'none', border: 'none', cursor: 'pointer', font: 'inherit', color: 'inherit' }}
                            >
                                ☰
                            </button>
                            <span 
                                onClick={() => handleNavigate("../inicio.html")} 
                                className="app-title" 
                                style={{ cursor: 'pointer', color: 'inherit' }}
                            >
                                EduNexus
                            </span>
                        </div>

                        <div className="top-bar-right" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                            {showSearch && (
                                <input
                                    type="text"
                                    placeholder="Buscar materia..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    autoFocus
                                    style={{
                                        padding: '5px 10px',
                                        borderRadius: '4px',
                                        border: '1px solid #ccc',
                                        outline: 'none'
                                    }}
                                />
                            )}
                            <button
                                className="icon-btn"
                                aria-label="Buscar"
                                onClick={() => setShowSearch(!showSearch)}
                                style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </button>
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="main-container">
                        <section className="news-banner">
                            {/* Botón de regreso explícito */}
                            <div style={{ marginBottom: '10px' }}>
                                <button 
                                    onClick={() => handleNavigate("../inicio.html")} 
                                    style={{
                                        display: 'inline-flex',
                                        alignItems: 'center',
                                        gap: '6px',
                                        background: 'none',
                                        border: 'none',
                                        cursor: 'pointer',
                                        color: 'inherit',
                                        fontSize: '0.9rem',
                                        fontWeight: 'bold',
                                        opacity: 0.8,
                                        padding: 0
                                    }}
                                >
                                    ← Volver al inicio
                                </button>
                            </div>

                            <h1 className="menu-title">Materias Complementarias</h1>
                            
                            <div className="news-box">
                                <h2>ASIGNATURAS OPTATIVAS DISPONIBLES</h2>
                                <p>
                                    Selecciona una de las materias complementarias para acceder a sus temas, materiales de estudio y actividades asociadas.
                                </p>
                            </div>
                        </section>

                        <section className="menu-grid">
                            {filteredMaterias.length > 0 ? (
                                filteredMaterias.map(item => (
                                    <div 
                                        key={item.id} 
                                        onClick={() => handleNavigate(item.link)} 
                                        className="grid-card-link" 
                                        style={{ 
                                            cursor: 'pointer', 
                                            textDecoration: 'none', 
                                            color: 'inherit',
                                            userSelect: 'none'
                                        }}
                                    >
                                        <div className="grid-card">
                                            <div className="card-image-wrapper">
                                                <img src={item.imageUrl} alt={item.alt} className="card-img" />
                                            </div>
                                            <h3 className="card-title">{item.title}</h3>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <p style={{ gridColumn: '1 / -1', textAlign: 'center', opacity: 0.7 }}>
                                    No se encontraron materias para "{searchTerm}"
                                </p>
                            )}
                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MateriasMenu />);
    </script>
</body>

</html>
