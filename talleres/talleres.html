<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexus - Talleres</title>

    <!-- HOJA DE ESTILOS FUTURISTA INDEPENDIENTE -->
    <link rel="stylesheet" href="talleres.css">
    
    <!-- React, ReactDOM y Babel por CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        function TalleresView() {
            // Estados para búsqueda y menú desplegable (hamburguesa)
            const [searchTerm, setSearchTerm] = React.useState('');
            const [showSearch, setShowSearch] = React.useState(false);
            const [showMenu, setShowMenu] = React.useState(false);

            // Lista de talleres en cuadrícula enlazados a sus respectivos detalles
            const talleresList = [
                {
                    id: 1,
                    title: "taller #1 de ciencias",
                    imageUrl: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=400&auto=format&fit=crop&q=80",
                    alt: "Taller de Ciencias",
                    link: "taller-detalle.html"
                },
                {
                    id: 2,
                    title: "taller #2 de robótica",
                    imageUrl: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=400&auto=format&fit=crop&q=80",
                    alt: "Taller de Robótica",
                    link: "taller-robotica-detalle.html" // <--- ENLAZADO AL DETALLE DE ROBÓTICA
                },
                {
                    id: 3,
                    title: "taller de matematicas #2",
                    imageUrl: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=400&auto=format&fit=crop&q=80",
                    alt: "Taller de Matemáticas",
                    link: "taller-detalle.html"
                },
                {
                    id: 4,
                    title: "Taller de ingles #5",
                    imageUrl: "https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=400&auto=format&fit=crop&q=80",
                    alt: "Taller de Inglés",
                    link: "taller-detalle.html"
                }
            ];

            // Filtrado según búsqueda
            const filteredTalleres = talleresList.filter(taller =>
                taller.title.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Regresar al Inicio
            const handleBackToHome = () => {
                window.location.href = "../Inicio.html";
            };

            // Función para navegar al detalle del taller seleccionado
            const handleCardClick = (link) => {
                if (link) {
                    window.location.href = link;
                }
            };

            return (
                <div className="talleres-page">
                    {/* Encabezado Superior */}
                    <header className="top-bar">
                        <div className="top-bar-left">
                            <button 
                                className="icon-btn" 
                                aria-label="Volver atrás"
                                onClick={handleBackToHome}
                            >
                                ←
                            </button>
                            <span className="app-title">talleres</span>
                        </div>

                        <div className="top-bar-right">
                            {showSearch && (
                                <input
                                    type="text"
                                    className="search-input"
                                    placeholder="Buscar taller..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    autoFocus
                                />
                            )}
                            
                            <button
                                className="icon-btn"
                                aria-label="Buscar"
                                onClick={() => setShowSearch(!showSearch)}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </button>

                            {/* Botón Menú Hamburguesa */}
                            <button
                                className="icon-btn"
                                aria-label="Menú"
                                onClick={() => setShowMenu(!showMenu)}
                            >
                                ☰
                            </button>

                            {/* Menú Desplegable Flotante */}
                            {showMenu && (
                                <div className="dropdown-menu">
                                    <a href="../guias/guias.html">Guías</a>
                                    <a href="../clases/clases.html">Clases</a>
                                    <a href="#">Ocupaciones</a>
                                    <a href="../materias/materias.html">Materias complementarias</a>
                                    <button className="btn-add-action">+ Agregar</button>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="talleres-container">
                        <section className="talleres-grid">
                            {filteredTalleres.length > 0 ? (
                                filteredTalleres.map((item) => (
                                    <article 
                                        key={item.id} 
                                        className="taller-card"
                                        onClick={() => handleCardClick(item.link)}
                                        style={{ cursor: 'pointer' }}
                                    >
                                        <div className="card-image-wrapper">
                                            <img 
                                                src={item.imageUrl} 
                                                alt={item.alt} 
                                                className="card-img" 
                                            />
                                        </div>
                                        <h3 className="card-title">{item.title}</h3>
                                    </article>
                                ))
                            ) : (
                                <p className="no-results">
                                    No se encontraron talleres para "{searchTerm}"
                                </p>
                            )}
                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TalleresView />);
    </script>
</body>
</html>
